name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        # Unit tests only. The end-to-end kernel tests skip here by design:
        # they need the ~70 MB Pyodide runtime staged into a bundle, which CI
        # does not fetch.
        run: swift test -v

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
